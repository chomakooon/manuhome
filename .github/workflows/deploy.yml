name: Deploy to Xserver

# main への push で自動ビルド & Xserver へ FTPS 転送
on:
  push:
    branches: [main]
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read

concurrency:
  group: xserver-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (.env.production を使用)
        run: npm run build

      # dist/ を Xserver のサブドメイン用ドキュメントルートへ FTPS 転送
      # 必要な Secrets: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / FTP_TARGET_DIR
      - name: Deploy to Xserver via FTPS
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          # 既存ファイルは差分同期（全削除はしない）
          dangerous-clean-slate: false
